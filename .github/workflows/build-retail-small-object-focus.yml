name: Build Retail Small Object Focus Corpus

on:
  push:
    paths:
      - '.github/workflows/build-retail-small-object-focus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-small-object:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Build real small-object emphasis crops
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          src = Path('datasets/retail_detection/supervisely_shelves_real')
          dst = Path('datasets/retail_detection/small_object_focus_real')
          if dst.exists(): shutil.rmtree(dst)
          for split in ('train','val','test'):
              (dst/'images'/split).mkdir(parents=True, exist_ok=True)
              (dst/'labels'/split).mkdir(parents=True, exist_ok=True)

          def read_labels(path, w, h):
              out=[]
              for line in path.read_text().splitlines():
                  p=line.split()
                  if len(p)!=5: continue
                  c=int(p[0]); xc,yc,bw,bh=map(float,p[1:])
                  x1=(xc-bw/2)*w; y1=(yc-bh/2)*h; x2=(xc+bw/2)*w; y2=(yc+bh/2)*h
                  out.append((c,x1,y1,x2,y2))
              return out

          total_images=0; total_boxes=0
          for split in ('train','val','test'):
              for imgp in sorted((src/'images'/split).glob('*')):
                  if imgp.suffix.lower() not in {'.jpg','.jpeg','.png'}: continue
                  labp=src/'labels'/split/(imgp.stem+'.txt')
                  if not labp.exists(): continue
                  im=Image.open(imgp).convert('RGB'); w,h=im.size
                  boxes=read_labels(labp,w,h)
                  if not boxes: continue
                  # dense overlapping windows; preserves source split to avoid leakage
                  windows=[]
                  for scale in (0.45,0.60,0.75):
                      cw=max(256,int(w*scale)); ch=max(256,int(h*scale))
                      xs=sorted(set([0,max(0,(w-cw)//2),max(0,w-cw)]))
                      ys=sorted(set([0,max(0,(h-ch)//2),max(0,h-ch)]))
                      for x in xs:
                          for y in ys:
                              windows.append((x,y,min(w,x+cw),min(h,y+ch)))
                  seen=set()
                  for wi,(x1,y1,x2,y2) in enumerate(windows):
                      key=(x1,y1,x2,y2)
                      if key in seen: continue
                      seen.add(key)
                      cw=x2-x1; ch=y2-y1
                      kept=[]
                      for c,bx1,by1,bx2,by2 in boxes:
                          ix1=max(x1,bx1); iy1=max(y1,by1); ix2=min(x2,bx2); iy2=min(y2,by2)
                          iw=max(0,ix2-ix1); ih=max(0,iy2-iy1)
                          inter=iw*ih; area=max(1,(bx2-bx1)*(by2-by1))
                          vis=inter/area
                          if vis < 0.45: continue
                          nx1=ix1-x1; ny1=iy1-y1; nx2=ix2-x1; ny2=iy2-y1
                          bw=(nx2-nx1)/cw; bh=(ny2-ny1)/ch
                          # emphasize small/medium boxes; skip oversized crops
                          if bw*bh > 0.28: continue
                          xc=((nx1+nx2)/2)/cw; yc=((ny1+ny2)/2)/ch
                          kept.append(f'{c} {xc:.6f} {yc:.6f} {bw:.6f} {bh:.6f}')
                      if len(kept) < 3: continue
                      crop=im.crop((x1,y1,x2,y2))
                      name=f'{imgp.stem}__smallfocus_{wi:02d}.jpg'
                      crop.save(dst/'images'/split/name, quality=92, optimize=True)
                      (dst/'labels'/split/(Path(name).stem+'.txt')).write_text('\n'.join(kept)+'\n')
                      total_images += 1; total_boxes += len(kept)

          (dst/'data.yaml').write_text('path: .\ntrain: images/train\nval: images/val\ntest: images/test\nnames:\n  0: product\n')
          print('small-object images', total_images, 'boxes', total_boxes)
          if total_images < 120 or total_boxes < 2000:
              raise SystemExit(f'Corpus too small: images={total_images}, boxes={total_boxes}')
          PY

      - name: Verify dataset cleanliness and labels
        run: |
          set -euo pipefail
          D=datasets/retail_detection/small_object_focus_real
          IMG=$(find "$D/images" -type f -name '*.jpg' | wc -l)
          LAB=$(find "$D/labels" -type f -name '*.txt' | wc -l)
          BOX=$(cat "$D"/labels/*/*.txt | wc -l)
          echo "images=$IMG labels=$LAB boxes=$BOX"
          test "$IMG" -eq "$LAB"
          test "$IMG" -ge 120
          test "$BOX" -ge 2000
          if find "$D" -type f \( -name '*.md' -o -name '*.py' -o -name '*.rst' -o -name '*.json' \) | grep -q .; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          for p in Path('datasets/retail_detection/small_object_focus_real/labels').rglob('*.txt'):
              for n,line in enumerate(p.read_text().splitlines(),1):
                  a=line.split(); assert len(a)==5,(p,n,line)
                  c=int(a[0]); vals=list(map(float,a[1:])); assert c==0
                  assert all(0.0 <= v <= 1.0 for v in vals),(p,n,vals)
          print('YOLO labels valid')
          PY

      - name: Commit dataset to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/retail_detection/small_object_focus_real
          git commit -m 'dataset: add real small-object focused shelf corpus' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
