name: Import Real SKU110K Dense Shelf Dataset

on:
  push:
    paths:
      - '.github/workflows/import-sku110k.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-real-dense-shelves:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: pip install --disable-pip-version-check "ultralytics<8.5"

      - name: Download official SKU-110K and convert to YOLO
        run: |
          set -euo pipefail
          mkdir -p /tmp/retail-datasets
          cd /tmp/retail-datasets
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://raw.githubusercontent.com/ultralytics/ultralytics/main/ultralytics/cfg/datasets/SKU-110K.yaml',
              'SKU-110K.yaml'
          )
          from ultralytics.data.utils import check_det_dataset
          print(check_det_dataset('SKU-110K.yaml', autodownload=True))
          PY

      - name: Normalize dataset into repository
        run: |
          set -euo pipefail
          SRC=/tmp/retail-datasets/datasets/SKU-110K
          test -d "$SRC/images"
          test -d "$SRC/labels"
          DEST="$GITHUB_WORKSPACE/datasets/retail_detection/sku110k_real"
          rm -rf "$DEST"
          mkdir -p "$DEST/images/train" "$DEST/images/val" "$DEST/images/test" "$DEST/labels/train" "$DEST/labels/val" "$DEST/labels/test"
          python - "$SRC" "$DEST" <<'PY'
          import sys, shutil
          from pathlib import Path
          src, dst = map(Path, sys.argv[1:])
          image_dir = src / 'images'
          label_dir = src / 'labels'
          for split in ('train','val','test'):
              list_file = src / f'{split}.txt'
              assert list_file.exists(), list_file
              lines = [x.strip() for x in list_file.read_text().splitlines() if x.strip()]
              copied = 0
              for i, line in enumerate(lines):
                  p = Path(line)
                  if not p.is_absolute():
                      p = (src / p).resolve()
                  if not p.exists():
                      p = image_dir / Path(line).name
                  assert p.exists(), p
                  lab = label_dir / f'{p.stem}.txt'
                  assert lab.exists(), lab
                  name = f'{split}_{i:06d}{p.suffix.lower()}'
                  shutil.copy2(p, dst/'images'/split/name)
                  shutil.copy2(lab, dst/'labels'/split/f'{Path(name).stem}.txt')
                  copied += 1
              print(split, copied)
          (dst/'data.yaml').write_text(
              'path: .\ntrain: images/train\nval: images/val\ntest: images/test\n\nnames:\n  0: product\n',
              encoding='utf-8'
          )
          PY

      - name: Verify real dense shelf dataset
        run: |
          set -euo pipefail
          D=datasets/retail_detection/sku110k_real
          if find "$D" -type f \( -name '*.md' -o -name '*.py' -o -name '*.rst' \) | grep -q .; then
            echo 'Forbidden non-dataset files found'
            exit 1
          fi
          IMG=$(find "$D/images" -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | wc -l)
          LAB=$(find "$D/labels" -type f -name '*.txt' | wc -l)
          BOX=$(cat "$D"/labels/*/*.txt | wc -l)
          echo "SKU110K real images: $IMG"
          echo "YOLO labels: $LAB"
          echo "Product boxes: $BOX"
          test "$IMG" -eq 11743
          test "$LAB" -eq 11743
          test "$BOX" -gt 1700000

      - name: Commit dataset directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/retail_detection/sku110k_real
          git commit -m 'dataset: import real SKU110K dense retail shelves' || exit 0
          git push origin HEAD:main
